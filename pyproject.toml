[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-agent"
version = "0.2.0"
description = "A stateful LangGraph research CLI with source-linked evidence, model fallback, and optional document retrieval."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Lucas Loo Tan"}]
dependencies = [
    "langchain-core==1.2.5",
    "langchain-openai==1.1.6",
    "langchain-google-genai==4.1.2",
    "langgraph==1.0.5",
    "langgraph-checkpoint-sqlite==3.0.1",
    "ddgs==9.10.0",
    "requests>=2.32.5,<3",
    "feedparser==6.0.12",
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
rag = [
    "langchain-pinecone==0.2.13",
    "langchain-text-splitters==1.1.0",
    "pinecone==7.3.0",
]

[project.scripts]
research-assistant = "main:main"
research-ingest = "ingest:main"

[project.urls]
Repository = "https://github.com/seekerPrice/research-assistant-agent"
Issues = "https://github.com/seekerPrice/research-assistant-agent/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools]
py-modules = ["main", "graph", "nodes", "tools", "state", "ingest", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
